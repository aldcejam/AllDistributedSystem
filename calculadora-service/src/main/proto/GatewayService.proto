syntax = "proto3";
package ufrn.aldcejam.grpc;

option java_multiple_files = true;
option java_package = "ufrn.aldcejam.grpc";
option java_outer_classname = "GatewayProto";

service GatewayService {
  rpc RegisterService (GrpcRegisterRequest) returns (GrpcRegisterResponse);
  rpc CheckHealth (GrpcHealthRequest) returns (GrpcHealthResponse);
}

message GrpcHealthRequest {
  string serviceName = 1;
}

message GrpcHealthResponse {
  bool healthy = 1;
}

message GrpcRegisterRequest {
  string serviceName = 1;
  string host = 2;
  int32 port = 3;
  string transport = 4;
}

message GrpcRegisterResponse {
  bool success = 1;
}
